name: CI

# OFF until the product is in production (2026-09-17). Every push to any branch
# on this private repo ran the whole pipeline, burning paid Actions minutes
# while iterating fast in dev — the same problem the RayAI boilerplate this
# project forked from hit and fixed the same way. The husky pre-push hook
# already runs `npm run verify` and `npm run e2e:smoke` on every push, so
# nothing here is unguarded meanwhile. Until then the pipeline runs only when
# somebody starts it by hand, from the Actions tab.
#
# Unlike RayAI at the time of that fix, `verify` below doesn't need Mongo/Redis
# to come back safely: every current unit suite mocks `connectDB`/Redis instead
# of opening a real connection. If a suite ever starts talking to a live
# database, give `verify` the same `services:` block `e2e-full` already has
# before turning the triggers back on, or it will hang instead of failing fast.
on:
  workflow_dispatch:

jobs:
  verify:
    name: Verify (lint, types, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verify
        run: npm run verify

  e2e-full:
    name: E2E Full
    runs-on: ubuntu-latest
    needs: verify
    # A browser run that stops making progress used to sit there until GitHub's
    # 6-hour ceiling. Half an hour is already generous next to the local smoke run.
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: rayai_user
          MONGO_INITDB_ROOT_PASSWORD: rayai_pass_local
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # mongo/redis come from the service containers above, so the Playwright
      # global-setup must NOT try to start docker-compose dev dependencies.
      E2E_SKIP_DOCKER_DEPS: '1'
      DATABASE_URL: mongodb://rayai_user:rayai_pass_local@localhost:27017/rayai?authSource=admin
      MONGO_USERNAME: rayai_user
      MONGO_PASSWORD: rayai_pass_local
      REDIS_HOST: localhost
      REDIS_PORT: 6380
      REDIS_PASSWORD: ''
      REDIS_URL: redis://localhost:6380
      AUTH_SECRET: ci-auth-secret
      AUTH_TRUST_HOST: 'true'
      APP_TOKEN_PEPPER: ci-token-pepper
      APP_BASE_URL_FRONT: http://localhost:3020
      APP_AZURE_STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
      APP_USER_EMAIL: e2e.admin@example.com
      APP_USER_PASSWORD: admin
      E2E_USER_EMAIL: e2e.admin@example.com
      E2E_USER_PASSWORD: admin
      E2E_USER_NEW_PASSWORD: Admin12345!
      PORT: 3020

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run full e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
