name: CI

# Runs on every push to main and on every pull request: the same gate a
# reviewer would apply by hand (format → lint → types → tests → build).
# The browser (Playwright) suite is slower and needs Mongo + Redis, so it
# stays out of the per-push gate and runs on demand from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Repository rules
        run: |
          npm run enforce:features
          npm run enforce:feature-url-style
          npm run enforce:worker-imports

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

  integration:
    name: Integration (real MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Testcontainers starts its own throwaway MongoDB through the runner's Docker.
      - name: Integration tests
        run: npm run test:int

  e2e-full:
    name: E2E (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A browser run that stops making progress would otherwise sit there until
    # GitHub's 6-hour ceiling. Half an hour is generous next to a local run.
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: custeio_user
          MONGO_INITDB_ROOT_PASSWORD: custeio_pass_local
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis/redis-stack-server:latest
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # mongo/redis come from the service containers above, so the Playwright
      # global-setup must NOT try to start docker-compose dev dependencies.
      E2E_SKIP_DOCKER_DEPS: '1'
      DATABASE_URL: mongodb://custeio_user:custeio_pass_local@localhost:27017/custeio?authSource=admin
      MONGO_USERNAME: custeio_user
      MONGO_PASSWORD: custeio_pass_local
      REDIS_HOST: localhost
      REDIS_PORT: 6380
      REDIS_PASSWORD: ''
      REDIS_URL: redis://localhost:6380
      AUTH_SECRET: ci-auth-secret
      AUTH_TRUST_HOST: 'true'
      APP_TOKEN_PEPPER: ci-token-pepper
      APP_BASE_URL_FRONT: http://localhost:3020
      APP_AZURE_STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
      APP_USER_EMAIL: e2e.admin@example.com
      APP_USER_PASSWORD: admin
      E2E_USER_EMAIL: e2e.admin@example.com
      E2E_USER_PASSWORD: admin
      E2E_USER_NEW_PASSWORD: Admin12345!
      PORT: 3020

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run full e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
