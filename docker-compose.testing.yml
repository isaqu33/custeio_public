name: custeio-testing

services:
  web:
    container_name: custeio-web-testing
    image: registry.pacs-worklist.com.br/testing.pacs-worklist.com.br/app:${VERSION:?Set VERSION before running docker compose}
    command: sh -c './node_modules/.bin/pm2-runtime start main.js --name app --node-args="${NODE_ARGS:-}"'
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      AUTH_TRUST_HOST: 'true'
      PORT: 3000
      APP_BASE_URL_FRONT: ${APP_BASE_URL_FRONT:-http://localhost:3000}
      APP_LOAD_UI: 'true'
      APP_LOAD_HTTP: 'true'
      APP_LOAD_ADMIN_API: 'true'
      APP_LOAD_INGESTION_API: 'false'
      APP_LOAD_GATEWAY_API: 'false'
      APP_LOAD_JOBS: 'false'
      APP_AZURE_STORAGE_CONNECTION_STRING: ${TESTING_AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite-custeio-testing:10000/devstoreaccount1;}
      APP_SYSTEM_ASSETS_CONTAINER: ${APP_SYSTEM_ASSETS_CONTAINER:-kairosflow-system-assets}
      DATABASE_URL: mongodb://${MONGO_USERNAME:-kairosflow_user}:${MONGO_PASSWORD:-kairosflow_pass_testing}@mongo-custeio-testing:27017/kairosflow?authSource=admin
      REDIS_HOST: redis-custeio-testing
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_testing}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_testing}@redis-custeio-testing:6379
    networks:
      - testing-network
    restart: unless-stopped
    depends_on:
      azurite:
        condition: service_started
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'scripts/healthcheck/app.js']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  ingestion-api:
    container_name: custeio-ingestion-api-testing
    image: registry.pacs-worklist.com.br/testing.pacs-worklist.com.br/app:${VERSION:?Set VERSION before running docker compose}
    command: sh -c './node_modules/.bin/pm2-runtime start main.js --name app --node-args="${NODE_ARGS:-}"'
    ports:
      - '${INGESTION_API_PORT:-3001}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      AUTH_TRUST_HOST: 'true'
      PORT: 3000
      APP_BASE_URL_FRONT: ${APP_BASE_URL_FRONT:-http://localhost:3000}
      APP_LOAD_UI: 'false'
      APP_LOAD_HTTP: 'true'
      APP_LOAD_ADMIN_API: 'false'
      APP_LOAD_INGESTION_API: 'true'
      APP_LOAD_GATEWAY_API: 'true'
      APP_LOAD_JOBS: 'false'
      APP_AZURE_STORAGE_CONNECTION_STRING: ${TESTING_AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite-custeio-testing:10000/devstoreaccount1;}
      APP_SYSTEM_ASSETS_CONTAINER: ${APP_SYSTEM_ASSETS_CONTAINER:-kairosflow-system-assets}
      DATABASE_URL: mongodb://${MONGO_USERNAME:-kairosflow_user}:${MONGO_PASSWORD:-kairosflow_pass_testing}@mongo-custeio-testing:27017/kairosflow?authSource=admin
      REDIS_HOST: redis-custeio-testing
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_testing}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_testing}@redis-custeio-testing:6379
    networks:
      - testing-network
    restart: unless-stopped
    depends_on:
      azurite:
        condition: service_started
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'scripts/healthcheck/app.js']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  worker:
    container_name: custeio-worker-testing
    image: registry.pacs-worklist.com.br/testing.pacs-worklist.com.br/app:${VERSION:?Set VERSION before running docker compose}
    command: sh -c './node_modules/.bin/pm2-runtime start main.js --name app --node-args="${NODE_ARGS:-}"'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_LOAD_UI: 'false'
      APP_LOAD_HTTP: 'false'
      APP_LOAD_ADMIN_API: 'false'
      APP_LOAD_INGESTION_API: 'false'
      APP_LOAD_GATEWAY_API: 'false'
      APP_LOAD_JOBS: 'true'
      APP_AZURE_STORAGE_CONNECTION_STRING: ${TESTING_AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite-custeio-testing:10000/devstoreaccount1;}
      DATABASE_URL: mongodb://${MONGO_USERNAME:-kairosflow_user}:${MONGO_PASSWORD:-kairosflow_pass_testing}@mongo-custeio-testing:27017/kairosflow?authSource=admin
      REDIS_HOST: redis-custeio-testing
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass_testing}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass_testing}@redis-custeio-testing:6379
    networks:
      - testing-network
    restart: unless-stopped
    depends_on:
      azurite:
        condition: service_started
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'scripts/healthcheck/worker.js']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  redis:
    container_name: redis-custeio-testing
    image: redis/redis-stack-server:latest
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass_testing}
    ports:
      - '${REDIS_PORT_HOST:-6382}:6379'
      - '${REDIS_INSIGHT_PORT_HOST:-8002}:8001'
    networks:
      - testing-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_pass_testing}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    container_name: mongo-custeio-testing
    image: mongo:6.0
    ports:
      - '${MONGO_PORT_HOST:-27019}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-kairosflow_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-kairosflow_pass_testing}
    volumes:
      - mongo_testing_data:/data/db
    networks:
      - testing-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  azurite:
    container_name: azurite-custeio-testing
    image: mcr.microsoft.com/azure-storage/azurite:latest
    # -l /data is what makes the mounted volume actually hold the blobs. Without it
    # Azurite writes to its workdir inside the container's writable layer, so the
    # volume is dead weight and every `docker compose up` that recreates this
    # container silently discards every uploaded file.
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck -l /data
    ports:
      - '${AZURITE_BLOB_PORT_HOST:-10001}:10000'
    volumes:
      - azurite_testing_data:/data
    networks:
      - testing-network
    restart: unless-stopped

networks:
  testing-network:
    driver: bridge

volumes:
  mongo_testing_data:
  azurite_testing_data:
